###############################################
# MoveIt Servo settings for MOVO right Jaco arm
###############################################
use_gazebo: false

## Incoming commands
command_in_type: "speed_units"
scale:
  linear: 0.35
  rotational: 0.8
  joint: 0.6
low_pass_filter_coeff: 2.0

## Outgoing commands
publish_period: 0.01
low_latency_mode: true
command_out_type: std_msgs/Float64MultiArray
publish_joint_positions: false
publish_joint_velocities: true
publish_joint_accelerations: false

## MoveIt properties
move_group_name: right_arm
planning_frame: base_link

## Frames
ee_frame_name: right_ee_link
robot_link_command_frame: base_link

## Stop behavior
incoming_command_timeout: 0.1
num_outgoing_halt_msgs_to_publish: 6

## Singularities and limits
lower_singularity_threshold: 15.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.12

## Topics
cartesian_command_in_topic: /movo_servo_teleop_demo/right/delta_twist_cmds
joint_command_in_topic: /movo_servo_teleop_demo/right/delta_joint_cmds
joint_topic: /joint_states
status_topic: /movo_servo_teleop_demo/right/status
command_out_topic: /movo_servo_teleop_demo/right/joint_velocity_cmd

## Collision checking
check_collisions: true
collision_check_rate: 40.0
collision_check_type: threshold_distance
self_collision_proximity_threshold: 0.03
scene_collision_proximity_threshold: 0.08
collision_distance_safety_factor: 1000.0
min_allowable_collision_distance: 0.01
