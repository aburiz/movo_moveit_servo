  joint1: 268.94
  joint2: 82.92
  joint3: 190.84
  joint4: 322.63
  joint5: 190.75
  joint6: 142.04
  joint7: 180.00

left_home_native_degrees:
  joint1: 91.06
  joint2: 277.08
  joint3: 169.16
  joint4: 37.37
  joint5: 169.25
  joint6: 217.96
  joint7: 180.00

