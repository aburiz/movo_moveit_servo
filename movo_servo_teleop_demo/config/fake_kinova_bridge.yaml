# Custom home from user (degrees):
# right: (268.94, 82.92, 190.84, 322.63, 190.75, 142.04, 180.00)
# left:  (91.06, 277.08, 169.16, 37.37, 169.25, 217.96, 180.00)
# Stored below as converted MOVO ROS joint coordinates (radians).
# These are kept as fallback if native-degree fields are removed.
# A1 is physically flipped relative to the legacy sim model, so joint1 is negated here.
right_home_positions:
  right_shoulder_pan_joint: 1.589297
  right_shoulder_lift_joint: -1.694366
  right_arm_half_joint: -2.952399
  right_elbow_joint: 2.489363
